name: authz-probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe collaborator permission endpoint with an empty-permissions token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set +e
          echo "actor=${ACTOR}"
          self=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission 2>&1); echo "self_rc=$? self_out=${self}"
          other=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/octocat/permission" --jq .permission 2>&1); echo "octocat_rc=$? octocat_out=${other}"
          me=$(gh api user --jq .login 2>&1); echo "user_rc=$? user_out=${me}"
